[project]
name = "collab-eval"
version = "0.1.0"
description = "Collaborative-effort evaluation harness: measures how LLM-agent utility scales with user involvement across multi-turn tasks, plus cost/latency-vs-utility analysis."
readme = "README.md"
license = { text = "MIT" }
# Pinned to 3.12: reproducibility is a first-class feature — the same
# interpreter runs locally (via uv), in CI, and in Docker. Exact package versions live in uv.lock.
requires-python = "==3.12.*"
dependencies = [
    "anthropic>=0.116.0",
    "matplotlib>=3.9",
    "openai>=2.44.0",
    "pandas>=2.2",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collab_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["collab_eval"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Defaults (E4/E7/E9, F) plus: I (import sorting), UP (modernize to 3.12 idioms),
# B (bugbear — common correctness footguns). Kept small on purpose.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
