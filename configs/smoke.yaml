# Smoke config: exercises the full episode-loop plumbing on the mock model.
# Zero API cost, no keys, deterministic — this is what CI runs.
run_name: smoke
output_dir: results
seeds: [0, 1]
max_turns: 3

tasks:
  - name: toy

models:
  - provider: mock
    model: mock-agent
    temperature: 0.0

user_sim:
  provider: mock
  model: mock-user
  effort_levels: [passive, moderate, active_steering]

judge:
  provider: mock
  model: mock-judge
  rubric_version: v0
