# Smoke config: exercises the full episode-loop plumbing on the mock model.
# Zero API cost, no keys, deterministic — this is what CI runs.
run_name: smoke
output_dir: results
seeds: [0, 1]
max_turns: 3

tasks:
  - name: toy

models:
  - provider: mock
    model: mock-agent
    temperature: 0.0

user_sim:
  provider: mock
  model: mock-user
  temperature: 0.7  # one pinned value per run — the sim is apparatus, not treatment
  effort_levels: [passive, moderate, active_steering]

judge:
  provider: mock
  model: mock-judge
  rubric_version: v0

telemetry:
  enabled: false  # observability knob, not an experiment knob — excluded from config_hash; CI stays quiet

cache:
  enabled: false
