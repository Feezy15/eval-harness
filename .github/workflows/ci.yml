# Keyless CI: every step runs on the mock model — no API keys, no network calls,
# so a fork or PR can never spend money or leak secrets.
name: ci

# Read-only token: makes "CI can never mutate the repo" true by construction,
# not just by the absence of write steps.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # uv reads .python-version and uv.lock: same pinned interpreter + deps as local dev.
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Coverage is report-only (no --cov-fail-under): the table in the log informs
      # PR review; the tests themselves are the gate.
      - run: uv run pytest -q --cov --cov-report=term-missing
      # The literal quickstart commands, as an end-to-end gate: exercise the CLI
      # entrypoints (argparse -> config load -> matrix -> result files -> plot)
      # that the unit suite doesn't cover. The analysis step consumes the smoke
      # step's JSONL, so together they prove the full produce-then-analyze chain.
      - run: uv run python -m collab_eval.runner --config configs/smoke.yaml
      - run: uv run python -m collab_eval.analysis --results results/smoke.jsonl
