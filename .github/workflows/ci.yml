# Keyless CI: every step runs on the mock model — no API keys, no network calls,
# so a fork or PR can never spend money or leak secrets.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # uv reads .python-version and uv.lock: same pinned interpreter + deps as local dev.
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # The literal quickstart command, as an end-to-end gate: exercises the CLI
      # entrypoint (argparse -> config load -> matrix -> result files) that the
      # unit suite doesn't cover.
      - run: uv run python -m collab_eval.runner --config configs/smoke.yaml
